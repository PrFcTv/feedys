name: CI

on:
  push:
    branches: [main]
  pull_request:

# Le dépôt est public : rien ne part ailleurs sans qu’on l’ait décidé.
env:
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [typecheck, lint, test, build]

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm ${{ matrix.check }}

  integration:
    name: test:integration
    runs-on: ubuntu-latest

    # ⚠️ Les tests d’intégration créent et détruisent leur propre base : le rôle
    #    de connexion doit pouvoir CREATE DATABASE et CREATE ROLE. Le super-
    #    utilisateur du service le peut.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: feedys
          POSTGRES_PASSWORD: feedys
          POSTGRES_DB: feedys
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U feedys -d feedys"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://feedys:feedys@localhost:5432/feedys

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test:integration

  e2e:
    name: e2e
    runs-on: ubuntu-latest

    # ⚠️ Le parcours crée sa PROPRE base (`feedys_e2e`) : le rôle de connexion
    #    doit pouvoir CREATE DATABASE. Le super-utilisateur du service le peut.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: feedys
          POSTGRES_PASSWORD: feedys
          POSTGRES_DB: feedys
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U feedys -d feedys"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://feedys:feedys@localhost:5432/feedys

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # ⚠️ Le navigateur seulement, avec ses dépendances système : le parcours
      #    ne tourne que sur Chromium (Web Speech, D-003).
      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm e2e

      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  # ⚠️ Le sixième check. Il ne pousse rien nulle part : il prouve que l’image se
  #    construit, ce qui est exactement ce qu’une CI peut prouver sans secrets.
  #    Un Dockerfile ne casse jamais à l’écriture, il casse à la construction.
  image:
    name: docker build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: feedys:ci
          build-args: |
            FEEDYS_VERSION=ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ⛔ Une image qui se construit mais refuse de démarrer sans base n’est pas
      #    prouvée par la construction seule. On vérifie les deux refus qui
      #    comptent — variables absentes, base injoignable — et leur message.
      - name: refuse de démarrer sans ses variables
        run: |
          sortie=$(docker run --rm feedys:ci 2>&1 || true)
          echo "$sortie"
          echo "$sortie" | grep -q 'variable(s) obligatoire(s) absente(s)'

      - name: refuse de démarrer sans base
        env:
          DATABASE_URL: postgresql://feedys:feedys@base-absente:5432/feedys
          FEEDYS_URL_PUBLIQUE: http://localhost:3000
          ANTHROPIC_API_KEY: cle-de-ci
          FEEDYS_MODELE: claude-sonnet-5
          FEEDYS_BO_MOT_DE_PASSE: mot-de-passe-de-ci
          FEEDYS_CLE_CHIFFREMENT: cle-de-ci
        run: |
          sortie=$(docker run --rm -e DATABASE_URL -e FEEDYS_URL_PUBLIQUE -e ANTHROPIC_API_KEY -e FEEDYS_MODELE -e FEEDYS_BO_MOT_DE_PASSE -e FEEDYS_CLE_CHIFFREMENT feedys:ci 2>&1 || true)
          echo "$sortie"
          echo "$sortie" | grep -q 'la base ne répond pas'
