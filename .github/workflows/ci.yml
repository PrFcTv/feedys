name: CI

on:
  push:
    branches: [main]
  pull_request:

# Le dépôt est public : rien ne part ailleurs sans qu’on l’ait décidé.
env:
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [typecheck, lint, test, build]

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm ${{ matrix.check }}

  integration:
    name: test:integration
    runs-on: ubuntu-latest

    # ⚠️ Les tests d’intégration créent et détruisent leur propre base : le rôle
    #    de connexion doit pouvoir CREATE DATABASE et CREATE ROLE. Le super-
    #    utilisateur du service le peut.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: feedys
          POSTGRES_PASSWORD: feedys
          POSTGRES_DB: feedys
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U feedys -d feedys"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://feedys:feedys@localhost:5432/feedys

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test:integration
